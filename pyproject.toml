[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics-from-scratch"
version = "0.1.0"
description = "Educational tools for AI product economics and cost per completed task."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tokenomics = "tokenomics_from_scratch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
